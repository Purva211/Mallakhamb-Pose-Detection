version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mallakhamb_backend
    restart: always
    environment:
      - BACKEND_PORT=5000
    env_file:
      - ../.env
    ports:
      - '5000:5000'
    networks:
      - mallakhamb-net

networks:
  mallakhamb-net:
    driver: bridge
